<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1,minimum-scale=1.0,maximum-scale=1.0" />
  <title>每日热点播报 · News Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Monochrome palette: pure black at different opacities on white */
      --bg: #ffffff;                  /* white page */
      --surface: #ffffff;             /* white surface */
      --surface-2: rgba(0, 0, 0, 0.035); /* subtle black fill */
      --line: rgba(0, 0, 0, 0.14);    /* hairline */
      --line-soft: rgba(0, 0, 0, 0.07); /* softer hairline */
      --text: rgba(0, 0, 0, 0.88);
      --strong: #000000;              /* pure black */
      --muted: rgba(0, 0, 0, 0.5);
      --faint: rgba(0, 0, 0, 0.36);
      --hair: 1px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Serif SC", serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.8;
      padding-bottom: 8rem;
      text-autospace: normal;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: min(1040px, calc(100% - 2.4rem));
      margin: 3rem auto 5rem;
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: var(--hair) solid var(--line);
      padding: 0 0 1.4rem;
    }

    .hero h2 {
      margin: 0;
      font-family: "Fraunces", "Noto Serif SC", serif;
      font-size: clamp(1.6rem, 3.4vw, 2.1rem);
      letter-spacing: 0.01em;
      font-weight: 500;
      color: var(--strong);
      flex: 1 1 auto;
    }

    .site-title-link {
      color: inherit;
      text-decoration: none;
    }

    .hero-links {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-left: auto;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .group-links {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: .5rem;
    }

    .hero a {
      color: var(--muted);
    }

    .top-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 1.85rem;
      padding: 0 .7rem;
      border: var(--hair) solid var(--line);
      background: transparent;
      color: var(--text);
      text-decoration: none;
      font-size: .85rem;
    }

    .top-btn.active {
      border-color: var(--strong);
      color: var(--strong);
    }

    .hero-link {
      color: var(--muted);
      text-decoration: none;
      font-size: .88rem;
    }

    .query {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .day {
      margin-top: 3.2rem;
    }

    .day-title {
      margin: 0 0 1.2rem;
      padding-bottom: .7rem;
      border-bottom: var(--hair) solid var(--line-soft);
      font-family: "Fraunces", "Noto Serif SC", serif;
      font-size: clamp(1.35rem, 2.6vw, 1.7rem);
      letter-spacing: 0.01em;
      font-weight: 500;
      color: var(--strong);
    }

    .day-title-row {
      margin: 0 0 1.2rem;
      padding-bottom: .7rem;
      border-bottom: var(--hair) solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
    }

    .day-title-row .day-title {
      margin: 0;
      padding-bottom: 0;
      border-bottom: 0;
    }

    .title-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 1.85rem;
      padding: 0 .7rem;
      border: var(--hair) solid var(--line);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: .82rem;
      cursor: pointer;
    }

    .title-action-btn.active {
      border-color: var(--strong);
      color: var(--strong);
    }

    .day-markdown-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.85rem;
      height: 1.85rem;
      padding: 0;
      border: var(--hair) solid var(--line);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }

    .day-markdown-btn:focus-visible {
      outline: 2px solid var(--strong);
      outline-offset: 2px;
    }

    .day-markdown-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      background: rgba(0, 0, 0, 0.42);
    }

    .day-markdown-modal.open {
      display: flex;
    }

    .day-markdown-dialog {
      width: min(720px, 100%);
      max-height: calc(100vh - 2.4rem);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: var(--hair) solid var(--line);
    }

    .day-markdown-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      padding: .8rem 1.1rem;
      border-bottom: var(--hair) solid var(--line-soft);
    }

    .day-markdown-header h3 {
      margin: 0;
      font-family: "Fraunces", "Noto Serif SC", serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--strong);
    }

    .day-markdown-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.85rem;
      height: 1.85rem;
      border: var(--hair) solid var(--line);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
    }

    .day-markdown-tools {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
    }

    .day-markdown-tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 1.85rem;
      padding: 0 .7rem;
      border: var(--hair) solid var(--line);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: .82rem;
      cursor: pointer;
    }

    .day-markdown-body {
      padding: 1.1rem 1.3rem 1.4rem;
      overflow-y: auto;
    }

    .day-markdown-raw {
      width: 100%;
      min-height: 18rem;
      max-height: calc(100vh - 12rem);
      margin: 0;
      padding: .9rem 1rem;
      border: var(--hair) solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Serif SC", monospace;
      font-size: .88rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
      resize: vertical;
    }

    .day-markdown-raw:focus {
      outline: 2px solid var(--strong);
      outline-offset: 2px;
    }

    .day-markdown-error {
      color: var(--muted);
      font-size: .92rem;
    }

    .day-title-link {
      color: inherit;
      text-decoration: none;
    }

    .card {
      margin: 0;
      padding: 1.3rem 0 1.2rem;
      border-bottom: var(--hair) solid var(--line-soft);
      background: transparent;
    }

    .card.playing {
      background: var(--surface-2);
    }

    .title {
      margin: 0 0 .6rem;
      font-size: 1.06rem;
      font-weight: 600;
      line-height: 1.5;
      color: var(--strong);
    }

    .summary {
      margin: .7rem 0 0;
      color: rgba(0, 0, 0, 0.68);
      font-size: .97rem;
    }

    .item-date {
      margin: .55rem 0 0;
      color: var(--faint);
      font-size: .84rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: .14rem .55rem;
      background: var(--surface-2);
      color: var(--muted);
      font-size: .78rem;
      white-space: nowrap;
    }

    .tag-directory {
      display: grid;
      gap: 0;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      margin-bottom: 1rem;
    }

    .tag-directory-item {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: .6rem;
      text-decoration: none;
      background: transparent;
      color: var(--text);
      padding: .7rem .2rem;
    }

    .tag-directory-item.dimmed {
      opacity: 0.28;
    }

    .tag-directory-count {
      color: var(--faint);
      font-size: .84rem;
    }

    .empty {
      margin: 0 0 1rem;
      padding: 1.2rem 0;
      color: var(--muted);
    }

    .status {
      margin: 1.2rem 0 0;
      color: var(--muted);
      text-align: center;
      min-height: 1.4rem;
      font-size: .9rem;
      letter-spacing: 0.02em;
    }

    .voice-toolbar {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 100%;
      border-top: var(--hair) solid var(--line);
      background: var(--surface);
      z-index: 20;
      padding: .9rem max(1.2rem, calc((100% - 1040px) / 2));
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: .6rem;
      align-items: center;
    }

    .voice-controls {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      align-items: center;
    }

    .voice-provider,
    .voice-range,
    .voice-token {
      height: 2.1rem;
      border-radius: 0;
      border: var(--hair) solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: .9rem;
      padding: 0 .6rem;
      outline: none;
    }

    .voice-provider:focus,
    .voice-range:focus,
    .voice-token:focus {
      border-color: var(--strong);
    }

    .voice-token-wrap {
      display: none;
      align-items: center;
      gap: .45rem;
      color: var(--muted);
      font-size: .85rem;
    }

    .voice-token-wrap.show {
      display: inline-flex;
    }

    .voice-token {
      min-width: 260px;
    }

    .voice-btn {
      height: 2.1rem;
      border-radius: 0;
      border: var(--hair) solid var(--line);
      background: transparent;
      color: var(--text);
      padding: 0 .9rem;
      font-family: inherit;
      font-size: .88rem;
      cursor: pointer;
    }

    .voice-btn.primary {
      border-color: var(--strong);
      background: var(--strong);
      color: #ffffff;
    }

    .voice-state {
      font-size: .85rem;
      color: var(--muted);
      text-align: right;
      min-height: 1.2rem;
    }

    @media (max-width: 820px) {
      .voice-toolbar {
        grid-template-columns: 1fr;
        padding: .9rem 1.2rem;
      }

      .voice-token {
        min-width: 0;
        width: 100%;
      }

      .voice-state {
        text-align: left;
      }
    }

    @media (max-width: 750px) {
      .hero {
        align-items: flex-start;
      }

      .hero h2 {
        flex-basis: 100%;
        margin-bottom: .6rem;
      }

      .hero-links {
        width: 100%;
        margin-left: 0;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h2><a class="site-title-link" href="./">每日热点语音播报</a></h2>
      <div class="hero-links">
        <div class="group-links" id="group-links" aria-label="分组导航"></div>
        <a class="top-btn" id="tags-button" href="?tags">标签</a>
        <a class="hero-link" href="https://x.com/codersoar">x@codersoar</a>
      </div>
    </section>
    <section id="content"></section>
    <div class="status" id="status"></div>
    <div id="sentinel" aria-hidden="true"></div>
  </main>

  <div class="voice-toolbar" role="region" aria-label="语音播放控制条">
    <div class="voice-controls">
      <select id="voice-provider" class="voice-provider" aria-label="语音服务提供方">
        <option value="browser">浏览器内置</option>
        <option value="mimo">Mimo</option>
      </select>
      <label class="voice-token-wrap" id="voice-token-wrap" for="voice-token">
        <span>Token</span>
        <input id="voice-token" class="voice-token" type="password" placeholder="输入 Mimo token">
      </label>
    </div>
    <div class="voice-controls">
      <select id="voice-range" class="voice-range" aria-label="播放范围">
        <option value="today">当日</option>
        <option value="three-days">三日</option>
        <option value="week">一周</option>
        <option value="all">全部</option>
      </select>
      <button id="voice-play-toggle" class="voice-btn primary" type="button">播放</button>
      <button id="voice-stop" class="voice-btn" type="button">停止</button>
    </div>
    <div class="voice-state" id="voice-state">等待播放</div>
  </div>

  <script>
    const queryParams = new URLSearchParams(window.location.search);
    const contentEl = document.getElementById("content");
    const statusEl = document.getElementById("status");
    const sentinel = document.getElementById("sentinel");
    const providerEl = document.getElementById("voice-provider");
    const tokenWrapEl = document.getElementById("voice-token-wrap");
    const tokenEl = document.getElementById("voice-token");
    const rangeEl = document.getElementById("voice-range");
    const playToggleEl = document.getElementById("voice-play-toggle");
    const stopEl = document.getElementById("voice-stop");
    const voiceStateEl = document.getElementById("voice-state");
    const groupLinksEl = document.getElementById("group-links");
    const tagsButtonEl = document.getElementById("tags-button");
    const VOICE_PROVIDER_STORAGE_KEY = "news.voice.provider";
    const VOICE_TOKEN_STORAGE_KEY = "news.voice.token";
    const VOICE_RANGE_STORAGE_KEY = "news.voice.range";
    const MAX_CONSECUTIVE_EMPTY_DAYS = 3;
    const PLAYBACK_EMPTY_DAY_SEARCH_LIMIT = 90;
    const PLAYBACK_PREFETCH_REMAINING_THRESHOLD = 3;
    const loadedDays = new Set();
    const dateDataCache = new Map();
    const markdownModalEl = createMarkdownModal();
    let loading = false;
    let loadStoppedByEmptyDays = false;
    let nextDate = getInitialDate();
    let currentAudio = null;
    let currentUtterance = null;
    let activeCard = null;
    let playbackRunning = false;
    let playbackPaused = false;
    let playbackCursor = 0;
    let playbackToken = 0;
    const mimoAudioUrlCache = new Map();
    const mimoFetchPromiseCache = new Map();
    const PAGE_MODE = queryParams.has("tags") ? "tags" : (queryParams.get("group") ? "group" : (queryParams.get("tag") ? "tag" : "home"));
    const CURRENT_GROUP = (queryParams.get("group") || "").trim();
    const CURRENT_TAG = (queryParams.get("tag") || "").trim();
    let hideGroupedTagsEnabled = false;


    function pad(v) {
      return String(v).padStart(2, "0");
    }

    function formatDate(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function parseDate(value) {
      const [year, month, day] = value.split("-").map(Number);
      const date = new Date(year, month - 1, day, 12, 0, 0);
      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
      ) {
        return null;
      }
      return date;
    }

    function isValidDateString(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
      return !!parseDate(value);
    }

    function previousDate(dateString) {
      const date = parseDate(dateString);
      if (!date) return dateString;
      date.setDate(date.getDate() - 1);
      return formatDate(date);
    }

    function getInitialDate() {
      const input = queryParams.get("date");
      if (input && isValidDateString(input)) {
        return input;
      }
      return new Date().toISOString().slice(0, 10);
    }

    function renderDayTitle(date) {
      const day = document.createElement("section");
      day.className = "day";
      const title = document.createElement("h2");
      title.className = "day-title";
      if (isValidDateString(date)) {
        day.dataset.date = date;
        const titleLink = document.createElement("a");
        titleLink.className = "day-title-link";
        titleLink.href = `?date=${encodeURIComponent(date)}`;
        titleLink.textContent = date;
        title.appendChild(titleLink);

        const row = document.createElement("div");
        row.className = "day-title-row";
        row.appendChild(title);

        const markdownBtn = document.createElement("button");
        markdownBtn.type = "button";
        markdownBtn.className = "day-markdown-btn";
        markdownBtn.setAttribute("aria-label", "查看当日热点 Markdown");
        markdownBtn.textContent = "▾";
        markdownBtn.title = "查看当日热点 Markdown";
        markdownBtn.addEventListener("click", () => {
          openDayMarkdownModal(date);
        });
        row.appendChild(markdownBtn);

        day.appendChild(row);
        contentEl.appendChild(day);
        return day;
      }
      title.textContent = date;
      day.appendChild(title);
      contentEl.appendChild(day);
      return day;
    }

    function renderCard(item, dayEl) {
      const card = document.createElement("article");
      card.className = "card";
      const fallbackDate = dayEl?.dataset?.date || "";
      const cardDate = isValidDateString(item?.date || "") ? item.date : fallbackDate;
      if (isValidDateString(cardDate)) {
        card.dataset.date = cardDate;
      }

      const title = document.createElement("h3");
      title.className = "title";
      title.textContent = item.title || "未命名热点";
      card.appendChild(title);

      const tags = document.createElement("div");
      tags.className = "tags";
      const tagList = Array.isArray(item.tags) && item.tags.length ? item.tags : ["未分类"];
      tagList.forEach(tag => {
        const node = document.createElement("span");
        node.className = "tag";
        node.textContent = tag;
        tags.appendChild(node);
      });
      card.appendChild(tags);

      const normalizedSummary = normalizeSummaryText(item.summary || "");
      if (normalizedSummary) {
        const summary = document.createElement("p");
        summary.className = "summary";
        summary.textContent = normalizedSummary;
        card.appendChild(summary);
      }

      if ((PAGE_MODE === "group" || PAGE_MODE === "tag") && item.date) {
        const date = document.createElement("p");
        date.className = "item-date";
        date.textContent = item.date;
        card.appendChild(date);
      }

      dayEl.appendChild(card);
    }

    function renderEmpty(date, text) {
      const dayEl = renderDayTitle(date);
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = text;
      dayEl.appendChild(empty);
    }

    function updateVoiceState(text) {
      voiceStateEl.textContent = text;
    }

    function saveVoiceProvider() {
      localStorage.setItem(VOICE_PROVIDER_STORAGE_KEY, providerEl.value);
    }

    function saveVoiceToken() {
      localStorage.setItem(VOICE_TOKEN_STORAGE_KEY, tokenEl.value);
    }

    function saveVoiceRange() {
      localStorage.setItem(VOICE_RANGE_STORAGE_KEY, rangeEl.value);
    }

    function restoreVoiceSettings() {
      const savedProvider = localStorage.getItem(VOICE_PROVIDER_STORAGE_KEY);
      if (savedProvider === "browser" || savedProvider === "mimo") {
        providerEl.value = savedProvider;
      }
      const savedRange = localStorage.getItem(VOICE_RANGE_STORAGE_KEY);
      if (savedRange === "today" || savedRange === "three-days" || savedRange === "week" || savedRange === "all") {
        rangeEl.value = savedRange;
      }
      tokenEl.value = localStorage.getItem(VOICE_TOKEN_STORAGE_KEY) || "";
      tokenWrapEl.classList.toggle("show", providerEl.value === "mimo");
    }

    function updatePlayButton() {
      if (!playbackRunning) {
        playToggleEl.textContent = "播放";
        return;
      }
      playToggleEl.textContent = playbackPaused ? "继续" : "暂停";
    }

    function setActiveCard(card) {
      if (activeCard && activeCard !== card) {
        activeCard.classList.remove("playing");
      }
      activeCard = card || null;
      if (activeCard) {
        activeCard.classList.add("playing");
      }
    }

    function centerCard(card) {
      if (!card) return;
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function normalizeSummaryText(summary) {
      const text = (summary || "").trim();
      if (!text) return "";
      if (isMeaninglessSummaryText(text)) return "";
      if (text.endsWith("。")) return text;
      const lastChinesePeriodIndex = text.lastIndexOf("。");
      if (lastChinesePeriodIndex === -1) {
        return text;
      }
      return text.slice(0, lastChinesePeriodIndex + 1);
    }

    function isMeaninglessSummaryText(text) {
      const compactText = text.replace(/[\s，。！？、,.!?；;：:“”"'‘’【】（）()《》<>]/g, "");
      if (!compactText) return true;
      if (compactText.includes("你好") || compactText.includes("您好")) {
        return true;
      }
      return false;
    }

    function getRangeDayLimit(range) {
      if (range === "today") return 1;
      if (range === "three-days") return 3;
      if (range === "week") return 7;
      return Infinity;
    }

    function getCardDateForPlayback(card) {
      const ownDate = card?.dataset?.date || "";
      if (isValidDateString(ownDate)) return ownDate;
      const dayDate = card?.closest(".day")?.dataset?.date || "";
      if (isValidDateString(dayDate)) return dayDate;
      return "";
    }

    function getDateRangeFilter(dateLimit, cards) {
      if (!Number.isFinite(dateLimit)) return null;
      const firstCardWithDate = cards.find(card => getCardDateForPlayback(card));
      const firstDate = firstCardWithDate ? getCardDateForPlayback(firstCardWithDate) : "";
      if (!firstDate) return null;
      const firstDateObj = parseDate(firstDate);
      if (!firstDateObj) return null;

      return (card) => {
        const cardDate = getCardDateForPlayback(card);
        if (!cardDate) return false;
        const cardDateObj = parseDate(cardDate);
        if (!cardDateObj) return false;
        const diffDays = Math.floor((firstDateObj.getTime() - cardDateObj.getTime()) / 86400000);
        return diffDays >= 0 && diffDays < dateLimit;
      };
    }

    function collectPlayableDayEls() {
      return Array.from(contentEl.querySelectorAll(".day"))
        .filter(dayEl => dayEl.dataset.date && dayEl.querySelector(".card"));
    }

    function collectSpeakableItems(range) {
      const dayLimit = getRangeDayLimit(range);
      const allCards = Array.from(contentEl.querySelectorAll(".card"));

      let cards = allCards;
      const dateRangeFilter = getDateRangeFilter(dayLimit, allCards);
      if (dateRangeFilter) {
        cards = allCards.filter(dateRangeFilter);
      } else {
        const dayEls = collectPlayableDayEls();
        const targetDayEls = Number.isFinite(dayLimit) ? dayEls.slice(0, dayLimit) : dayEls;
        if (targetDayEls.length) {
          cards = targetDayEls.flatMap(dayEl => Array.from(dayEl.querySelectorAll(".card")));
        }
      }

      return cards
        .map(card => {
          const title = card.querySelector(".title")?.textContent?.trim() || "";
          const summaryRaw = card.querySelector(".summary")?.textContent?.trim() || "";
          const summary = normalizeSummaryText(summaryRaw);
          const text = [title, summary].filter(Boolean).join("。 ");
          return { card, text };
        })
        .filter(item => item.text);
    }

    async function ensureRangeDaysLoaded(range, token) {
      if (PAGE_MODE !== "home") return;
      const dayLimit = getRangeDayLimit(range);
      if (!Number.isFinite(dayLimit)) return;

      while (collectPlayableDayEls().length < dayLimit) {
        if (token !== playbackToken) return;
        if (loading) {
          await new Promise(resolve => setTimeout(resolve, 120));
          continue;
        }
        const loaded = await loadNext({
          allowBypassStop: true,
          maxConsecutiveEmptyDays: PLAYBACK_EMPTY_DAY_SEARCH_LIMIT,
          silentStatus: true
        });
        if (!loaded) return;
      }
    }

    async function ensureSpeakableItems(range, token) {
      await ensureRangeDaysLoaded(range, token);
      let items = collectSpeakableItems(range);
      if (items.length) return items;

      updateVoiceState("正在查找可播放日期");
      while (true) {
        if (token !== playbackToken) {
          return [];
        }
        if (loading) {
          await new Promise(resolve => setTimeout(resolve, 120));
        } else {
          const loaded = await loadNext({
            allowBypassStop: true,
            maxConsecutiveEmptyDays: PLAYBACK_EMPTY_DAY_SEARCH_LIMIT,
            silentStatus: true
          });
          if (!loaded) {
            return [];
          }
        }
        await ensureRangeDaysLoaded(range, token);
        items = collectSpeakableItems(range);
        if (items.length) {
          return items;
        }
      }
    }

    async function maybePrefetchByRange(range, items, cursor, token) {
      if (PAGE_MODE !== "home") return items;

      if (Number.isFinite(getRangeDayLimit(range))) {
        await ensureRangeDaysLoaded(range, token);
      }

      const remaining = items.length - cursor - 1;
      if (range === "all" && remaining <= PLAYBACK_PREFETCH_REMAINING_THRESHOLD && token === playbackToken) {
        if (!loading) {
          await loadNext({
            allowBypassStop: true,
            maxConsecutiveEmptyDays: PLAYBACK_EMPTY_DAY_SEARCH_LIMIT,
            silentStatus: true
          });
        }
      }

      return collectSpeakableItems(range);
    }

    function clearSpeechEngines() {
      if (currentAudio) {
        if (currentAudio.src.startsWith("blob:")) {
          URL.revokeObjectURL(currentAudio.src);
        }
        currentAudio.pause();
        currentAudio.src = "";
        currentAudio = null;
      }
      if (currentUtterance) {
        speechSynthesis.cancel();
        currentUtterance = null;
      }
    }

    function clearMimoCache() {
      mimoAudioUrlCache.forEach(url => URL.revokeObjectURL(url));
      mimoAudioUrlCache.clear();
      mimoFetchPromiseCache.clear();
    }

    function stopPlayback(message = "已停止") {
      playbackToken += 1;
      playbackRunning = false;
      playbackPaused = false;
      playbackCursor = 0;
      clearSpeechEngines();
      clearMimoCache();
      setActiveCard(null);
      updatePlayButton();
      updateVoiceState(message);
    }

    function pausePlayback() {
      if (!playbackRunning || playbackPaused) return;
      if (providerEl.value === "browser") {
        speechSynthesis.pause();
      } else if (currentAudio) {
        currentAudio.pause();
      }
      playbackPaused = true;
      updatePlayButton();
      updateVoiceState("已暂停");
    }

    function resumePlayback() {
      if (!playbackRunning || !playbackPaused) return;
      if (providerEl.value === "browser") {
        speechSynthesis.resume();
      } else if (currentAudio) {
        const playResult = currentAudio.play();
        if (playResult && typeof playResult.catch === "function") {
          playResult.catch(() => {});
        }
      }
      playbackPaused = false;
      updatePlayButton();
      updateVoiceState("播放中");
    }

    function decodeBase64ToBlob(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new Blob([bytes], { type: "audio/wav" });
    }

    function speakWithBrowser(text, token) {
      return new Promise(resolve => {
        if (token !== playbackToken) {
          resolve();
          return;
        }
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-CN";
        utterance.rate = 1;
        utterance.pitch = 1;
        currentUtterance = utterance;
        utterance.onend = () => {
          currentUtterance = null;
          resolve();
        };
        utterance.onerror = () => {
          currentUtterance = null;
          resolve();
        };
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
      });
    }

    async function requestMimoAudioUrl(text, token, shouldShowSynthState) {
      const mimoToken = tokenEl.value.trim();
      if (!mimoToken) {
        throw new Error("请先输入 Mimo token");
      }
      if (shouldShowSynthState) {
        updateVoiceState("音频合成中");
      }
      const response = await fetch("https://api.xiaomimimo.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + mimoToken
        },
        body: JSON.stringify({
          model: "mimo-v2.5-tts",
          messages: [{
            role: "assistant",
            content: text
          }],
          audio: {
            format: "wav",
            voice: "茉莉"
          }
        })
      });

      if (!response.ok) {
        throw new Error(`Mimo 请求失败: ${response.status}`);
      }

      const data = await response.json();
      const base64Audio = data?.choices?.[0]?.message?.audio?.data;
      if (!base64Audio) {
        throw new Error("Mimo 返回中未找到音频数据");
      }

      if (token !== playbackToken) {
        throw new Error("播放已停止");
      }

      const blob = decodeBase64ToBlob(base64Audio);
      return URL.createObjectURL(blob);
    }

    async function getMimoAudioUrl(items, index, token, shouldShowSynthState) {
      if (mimoAudioUrlCache.has(index)) {
        return mimoAudioUrlCache.get(index);
      }
      if (!mimoFetchPromiseCache.has(index)) {
        const promise = requestMimoAudioUrl(items[index].text, token, shouldShowSynthState)
          .then(url => {
            mimoAudioUrlCache.set(index, url);
            return url;
          })
          .finally(() => {
            mimoFetchPromiseCache.delete(index);
          });
        mimoFetchPromiseCache.set(index, promise);
      }
      return mimoFetchPromiseCache.get(index);
    }

    function preloadMimoAudio(items, index, token) {
      if (index < 0 || index >= items.length) return;
      if (mimoAudioUrlCache.has(index) || mimoFetchPromiseCache.has(index)) return;
      getMimoAudioUrl(items, index, token, false).catch(() => {});
    }

    function playMimoAudioUrl(url) {
      return new Promise((resolve, reject) => {
        const audio = new Audio(url);
        audio.preload = "auto";
        audio.muted = false;
        audio.volume = 1;
        audio.setAttribute("playsinline", "");
        currentAudio = audio;
        let started = false;
        let settled = false;

        const settleReject = (error) => {
          if (settled) return;
          settled = true;
          URL.revokeObjectURL(url);
          currentAudio = null;
          reject(error);
        };

        const settleResolve = () => {
          if (settled) return;
          settled = true;
          URL.revokeObjectURL(url);
          currentAudio = null;
          resolve();
        };

        const tryPlay = () => {
          try {
            return audio.play();
          } catch (error) {
            settleReject(error instanceof Error ? error : new Error("音频播放失败"));
            return null;
          }
        };

        const startTimeout = setTimeout(() => {
          if (!started) {
            settleReject(new Error("音频未开始播放，可能受设备自动播放策略限制"));
          }
        }, 3500);

        audio.onplaying = () => {
          started = true;
          clearTimeout(startTimeout);
        };

        audio.onplay = () => {
          started = true;
          clearTimeout(startTimeout);
        };

        audio.oncanplay = () => {
          if (!started && !settled) {
            const retryResult = tryPlay();
            if (retryResult && typeof retryResult.catch === "function") {
              retryResult.catch(error => {
                clearTimeout(startTimeout);
                settleReject(error);
              });
            }
          }
        };

        audio.onended = () => {
          clearTimeout(startTimeout);
          settleResolve();
        };
        audio.onerror = () => {
          clearTimeout(startTimeout);
          settleReject(new Error("音频播放失败"));
        };

        const playResult = tryPlay();
        if (playResult && typeof playResult.then === "function") {
          playResult.catch(error => {
            clearTimeout(startTimeout);
            settleReject(error);
          });
        }
      });
    }

    async function speakWithMimo(text, token) {
      const url = await requestMimoAudioUrl(text, token, true);
      await playMimoAudioUrl(url);
    }

    async function speakText(text, token) {
      if (providerEl.value === "mimo") {
        await speakWithMimo(text, token);
        return;
      }
      await speakWithBrowser(text, token);
    }

    async function startPlayback() {
      const range = rangeEl.value;
      playbackRunning = true;
      playbackPaused = false;
      playbackToken += 1;
      const token = playbackToken;
      updatePlayButton();

      let items = await ensureSpeakableItems(range, token);
      if (token !== playbackToken) {
        return;
      }
      if (!items.length) {
        playbackRunning = false;
        playbackPaused = false;
        updatePlayButton();
        updateVoiceState("暂无可播放内容");
        return;
      }

      try {
        while (token === playbackToken) {
          if (playbackCursor >= items.length) {
            if (PAGE_MODE === "home") {
              items = await maybePrefetchByRange(range, items, playbackCursor, token);
            }
            if (playbackCursor >= items.length) {
              playbackCursor = 0;
              if (!items.length) {
                break;
              }
            }
          }

          const item = items[playbackCursor];
          setActiveCard(item.card);
          centerCard(item.card);

          if (providerEl.value === "mimo") {
            const currentUrl = await getMimoAudioUrl(items, playbackCursor, token, true);
            if (token !== playbackToken) return;
            mimoAudioUrlCache.delete(playbackCursor);

            const nextIndex = playbackCursor + 1 < items.length ? playbackCursor + 1 : -1;
            if (nextIndex >= 0) {
              preloadMimoAudio(items, nextIndex, token);
            }

            updateVoiceState(`播放中 ${playbackCursor + 1}/${items.length}`);
            await playMimoAudioUrl(currentUrl);
          } else {
            updateVoiceState(`播放中 ${playbackCursor + 1}/${items.length}`);
            await speakText(item.text, token);
          }

          if (token !== playbackToken) {
            return;
          }
          playbackCursor += 1;

          items = await maybePrefetchByRange(range, items, playbackCursor, token);
          if (token !== playbackToken) {
            return;
          }
          if (!items.length) {
            break;
          }
          if (playbackCursor >= items.length) {
            playbackCursor = 0;
          }
        }

        if (token === playbackToken) {
          stopPlayback("播放完成");
        }
      } catch (error) {
        stopPlayback(error.message || "播放失败");
      }
    }

    async function loadDate(dateString) {
      if (loadedDays.has(dateString)) return false;
      loadedDays.add(dateString);

      try {
        const res = await fetch(`${dateString}.json`);
        if (!res.ok) {
          return false;
        }
        const data = await res.json();
        const summaries = Array.isArray(data.summary) ? data.summary : [];
        if (!summaries.length) {
          return false;
        }
        dateDataCache.set(data.date || dateString, data);
        const dayEl = renderDayTitle(data.date || dateString);
        summaries.forEach(item => renderCard(item, dayEl));
        return true;
      } catch (error) {
        return false;
      }
    }

    async function fetchDateData(dateString) {
      if (dateDataCache.has(dateString)) {
        return dateDataCache.get(dateString);
      }
      try {
        const res = await fetch(`${dateString}.json`);
        if (!res.ok) return null;
        const data = await res.json();
        if (Array.isArray(data.summary) && data.summary.length) {
          dateDataCache.set(data.date || dateString, data);
          return data;
        }
      } catch (error) {
        // ignore
      }
      return null;
    }

    async function fetchGroupData() {
      try {
        const res = await fetch("group.json");
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data.groups) ? data.groups : [];
      } catch (error) {
        return [];
      }
    }

    function buildDayMarkdown(dateString, data, groups) {
      const items = Array.isArray(data?.summary) ? data.summary : [];
      const dateDisplay = dateString.replace(/-/g, "/");
      const used = new Set();
      const sections = [];
      sections.push(`## 每日热点（${dateDisplay}）`);
      groups.forEach(groupItem => {
        const groupName = String(groupItem?.group || "").trim();
        const tagSet = new Set(
          (Array.isArray(groupItem?.tags) ? groupItem.tags : [])
            .map(tag => String(tag || "").trim())
            .filter(Boolean)
        );
        const matched = [];
        items.forEach(item => {
          if (used.has(item)) return;
          const description = normalizeSummaryText(item?.summary || "");
          if (!description) return;
          const tagList = Array.isArray(item?.tags) ? item.tags : [];
          const hit = tagList.some(tag => tagSet.has(String(tag || "").trim()));
          if (!hit) return;
          matched.push({ item, description });
        });
        if (!matched.length) return;
        sections.push(`### ${groupName}`);
        matched.forEach(({ item, description }) => {
          used.add(item);
          const titleText = String(item?.title || "").trim() || "未命名热点";
          sections.push(`#### ${titleText}`);
          sections.push(description);
        });
      });
      return sections.join("\n\n");
    }

    function createMarkdownModal() {
      const modal = document.createElement("div");
      modal.className = "day-markdown-modal";
      modal.setAttribute("role", "dialog");
      modal.setAttribute("aria-modal", "true");
      modal.setAttribute("aria-hidden", "true");

      const dialog = document.createElement("div");
      dialog.className = "day-markdown-dialog";

      const header = document.createElement("div");
      header.className = "day-markdown-header";
      const heading = document.createElement("h3");
      heading.textContent = "每日热点 Markdown";

      const tools = document.createElement("div");
      tools.className = "day-markdown-tools";

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.className = "day-markdown-tool-btn";
      copyBtn.textContent = "复制";

      const downloadBtn = document.createElement("button");
      downloadBtn.type = "button";
      downloadBtn.className = "day-markdown-tool-btn";
      downloadBtn.textContent = "下载";

      const titlesBtn = document.createElement("button");
      titlesBtn.type = "button";
      titlesBtn.className = "day-markdown-tool-btn titles-btn";
      titlesBtn.textContent = "仅展示标题";
      modal.dataset.view = "full";

      const closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "day-markdown-close";
      closeBtn.setAttribute("aria-label", "关闭");
      closeBtn.textContent = "✕";
      closeBtn.addEventListener("click", closeDayMarkdownModal);

      const raw = document.createElement("textarea");
      raw.className = "day-markdown-raw";
      raw.setAttribute("aria-label", "Markdown 原文");
      raw.setAttribute("readonly", "");

      copyBtn.addEventListener("click", async () => {
        const text = raw.value;
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
          copyBtn.textContent = "已复制";
        } catch (error) {
          raw.focus();
          raw.select();
          try { document.execCommand("copy"); copyBtn.textContent = "已复制"; } catch (e) {}
        }
        setTimeout(() => { copyBtn.textContent = "复制"; }, 1500);
      });

      downloadBtn.addEventListener("click", () => {
        const text = raw.value;
        if (!text) return;
        const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${markdownModalEl.dataset.date || "news"}.md`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      titlesBtn.addEventListener("click", () => {
        if (!raw.dataset.full) raw.dataset.full = raw.value;
        if (markdownModalEl.dataset.view === "titles") {
          markdownModalEl.dataset.view = "full";
          titlesBtn.textContent = "仅展示标题";
          raw.value = raw.dataset.full;
        } else {
          markdownModalEl.dataset.view = "titles";
          titlesBtn.textContent = "展示全文";
          const dateStr = markdownModalEl.dataset.date || "";
          const titles = (raw.dataset.full || "")
            .split("\n")
            .filter(line => /^####\s+/.test(line))
            .map(line => "* " + line.replace(/^####\s+/, "").trim())
            .join("\n");
          const header = `每日热点 ${dateStr}`;
          raw.value = [header, titles].filter(Boolean).join("\n") + (titles ? "\n" : "");
        }
      });

      tools.appendChild(copyBtn);
      tools.appendChild(downloadBtn);
      tools.appendChild(titlesBtn);
      tools.appendChild(closeBtn);

      header.appendChild(heading);
      header.appendChild(tools);

      const body = document.createElement("div");
      body.className = "day-markdown-body";
      body.appendChild(raw);

      dialog.appendChild(header);
      dialog.appendChild(body);
      modal.appendChild(dialog);

      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeDayMarkdownModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && modal.classList.contains("open")) {
          closeDayMarkdownModal();
        }
      });

      document.body.appendChild(modal);
      return modal;
    }

    function closeDayMarkdownModal() {
      if (!markdownModalEl) return;
      markdownModalEl.classList.remove("open");
      markdownModalEl.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    async function openDayMarkdownModal(dateString) {
      if (!markdownModalEl) return;
      if (!isValidDateString(dateString)) return;
      const raw = markdownModalEl.querySelector(".day-markdown-raw");
      const titlesBtn = markdownModalEl.querySelector(".day-markdown-tool-btn.titles-btn");
      if (raw) {
        raw.value = "加载中...";
        raw.readOnly = true;
        delete raw.dataset.full;
      }
      markdownModalEl.dataset.view = "full";
      if (titlesBtn) titlesBtn.textContent = "仅展示标题";
      markdownModalEl.dataset.date = dateString;
      markdownModalEl.classList.add("open");
      markdownModalEl.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      const [data, groups] = await Promise.all([
        fetchDateData(dateString),
        fetchGroupData()
      ]);
      if (!raw) return;
      if (!data) {
        raw.value = "当日数据加载失败";
        return;
      }
      raw.value = buildDayMarkdown(dateString, data, groups);
    }

    function createGroupedTagSet(groups) {
      const set = new Set();
      groups.forEach(groupItem => {
        const tags = Array.isArray(groupItem?.tags) ? groupItem.tags : [];
        tags.forEach(tag => {
          const normalizedTag = String(tag || "").trim();
          if (normalizedTag) {
            set.add(normalizedTag);
          }
        });
      });
      return set;
    }

    function updateGroupedTagOpacity() {
      const groupedItems = Array.from(contentEl.querySelectorAll(".tag-directory-item[data-in-group='1']"));
      groupedItems.forEach(item => {
        item.classList.toggle("dimmed", hideGroupedTagsEnabled);
      });
    }

    function renderTagDirectory(items, groupedTagSet) {
      const dayEl = renderDayTitle("标签");
      const title = dayEl.querySelector(".day-title");
      if (title) {
        const row = document.createElement("div");
        row.className = "day-title-row";

        const button = document.createElement("button");
        button.type = "button";
        button.className = "title-action-btn";
        button.textContent = "未分组标签";
        button.setAttribute("aria-pressed", "false");
        button.addEventListener("click", () => {
          hideGroupedTagsEnabled = !hideGroupedTagsEnabled;
          button.classList.toggle("active", hideGroupedTagsEnabled);
          button.setAttribute("aria-pressed", String(hideGroupedTagsEnabled));
          updateGroupedTagOpacity();
        });

        title.parentNode.insertBefore(row, title);
        row.appendChild(title);
        row.appendChild(button);
      }

      const box = document.createElement("div");
      box.className = "tag-directory";

      items.forEach(item => {
        const tagName = String(item.tag || "").trim();
        if (!tagName) return;
        const link = document.createElement("a");
        link.className = "tag-directory-item";
        link.href = `?tag=${encodeURIComponent(tagName)}`;
        link.dataset.inGroup = groupedTagSet.has(tagName) ? "1" : "0";

        const name = document.createElement("span");
        name.textContent = tagName;
        link.appendChild(name);

        const count = document.createElement("span");
        count.className = "tag-directory-count";
        count.textContent = `${item.count}`;
        link.appendChild(count);

        box.appendChild(link);
      });

      dayEl.appendChild(box);
      updateGroupedTagOpacity();
    }

    function renderGroupDirectory(items) {
      if (!groupLinksEl) return;
      groupLinksEl.textContent = "";
      items.forEach(item => {
        const link = document.createElement("a");
        link.className = "top-btn";
        link.href = `?group=${encodeURIComponent(item.group)}`;
        if (item.group === CURRENT_GROUP) {
          link.classList.add("active");
          link.setAttribute("aria-current", "page");
        }
        link.textContent = item.group;
        groupLinksEl.appendChild(link);
      });
    }

    async function loadTagsPage() {
      statusEl.textContent = "加载中...";
      try {
        const [tagsRes, groupRes] = await Promise.all([
          fetch("tags.json"),
          fetch("group.json")
        ]);
        if (!tagsRes.ok) {
          renderEmpty("标签", "标签数据尚未生成");
          return;
        }
        const data = await tagsRes.json();
        const tags = Array.isArray(data.tags) ? data.tags : [];
        if (!tags.length) {
          renderEmpty("标签", "暂无标签数据");
          return;
        }

        let groupedTagSet = new Set();
        if (groupRes.ok) {
          const groupData = await groupRes.json();
          const groups = Array.isArray(groupData.groups) ? groupData.groups : [];
          groupedTagSet = createGroupedTagSet(groups);
        }

        renderTagDirectory(tags, groupedTagSet);
      } catch (error) {
        renderEmpty("标签", "标签数据加载失败");
      } finally {
        statusEl.textContent = "";
      }
    }

    async function loadGroupNav() {
      if (!groupLinksEl) return;
      try {
        const res = await fetch("group.json");
        if (!res.ok) {
          return;
        }
        const data = await res.json();
        const groups = Array.isArray(data.groups) ? data.groups : [];
        renderGroupDirectory(groups);
      } catch (error) {
        groupLinksEl.textContent = "";
      }
    }

    async function loadTagPage(tag) {
      if (!tag) {
        renderEmpty("标签", "未指定标签");
        return;
      }

      statusEl.textContent = "加载中...";
      const fileName = `tags/${encodeURIComponent(tag)}.json`;
      try {
        const res = await fetch(fileName);
        if (!res.ok) {
          renderEmpty(`标签：${tag}`, "该标签暂无数据");
          return;
        }
        const data = await res.json();
        const summaries = Array.isArray(data.summary) ? data.summary : [];
        if (!summaries.length) {
          renderEmpty(`标签：${tag}`, "该标签暂无数据");
          return;
        }
        const dayEl = renderDayTitle(`标签：${data.tag || tag}`);
        summaries.forEach(item => renderCard(item, dayEl));
      } catch (error) {
        renderEmpty(`标签：${tag}`, "标签数据加载失败");
      } finally {
        statusEl.textContent = "";
      }
    }

    async function loadGroupPage(group) {
      if (!group) {
        renderEmpty("分组", "未指定分组");
        return;
      }

      statusEl.textContent = "加载中...";
      const fileName = `groups/${encodeURIComponent(group)}.json`;
      try {
        const res = await fetch(fileName);
        if (!res.ok) {
          renderEmpty(`分组：${group}`, "该分组暂无数据");
          return;
        }
        const data = await res.json();
        const summaries = Array.isArray(data.summary) ? data.summary : [];
        if (!summaries.length) {
          renderEmpty(`分组：${group}`, "该分组暂无数据");
          return;
        }
        const dayEl = renderDayTitle(`分组：${data.group || group}`);
        summaries.forEach(item => renderCard(item, dayEl));
      } catch (error) {
        renderEmpty(`分组：${group}`, "分组数据加载失败");
      } finally {
        statusEl.textContent = "";
      }
    }

    async function loadNext(options = {}) {
      const {
        allowBypassStop = false,
        maxConsecutiveEmptyDays = MAX_CONSECUTIVE_EMPTY_DAYS,
        silentStatus = false
      } = options;

      if (loading || (loadStoppedByEmptyDays && !allowBypassStop)) return false;
      loading = true;
      if (!silentStatus) {
        statusEl.textContent = "加载中...";
      }

      let loadedData = false;
      try {
        let consecutiveEmptyDays = 0;
        while (consecutiveEmptyDays < maxConsecutiveEmptyDays) {
          const current = nextDate;
          nextDate = previousDate(nextDate);
          const hasData = await loadDate(current);
          if (hasData) {
            loadedData = true;
            return true;
          }
          consecutiveEmptyDays += 1;
        }

        if (!allowBypassStop) {
          loadStoppedByEmptyDays = true;
          observer.unobserve(sentinel);
          if (!silentStatus) {
            statusEl.textContent = `前${MAX_CONSECUTIVE_EMPTY_DAYS}日连续暂无数据，已停止自动加载`;
          }
        }
        return false;
      } finally {
        loading = false;
        if (!loadStoppedByEmptyDays && !silentStatus && loadedData) {
          statusEl.textContent = "";
        }
      }
    }

    const observer = new IntersectionObserver(entries => {
      if (entries.some(entry => entry.isIntersecting)) {
        loadNext();
      }
    }, { rootMargin: "220px 0px" });

    providerEl.addEventListener("change", () => {
      saveVoiceProvider();
      tokenWrapEl.classList.toggle("show", providerEl.value === "mimo");
      if (playbackRunning) {
        stopPlayback("服务已切换");
      }
    });

    tokenEl.addEventListener("input", () => {
      saveVoiceToken();
    });

    rangeEl.addEventListener("change", () => {
      saveVoiceRange();
      if (playbackRunning) {
        stopPlayback("播放范围已切换");
      }
    });

    playToggleEl.addEventListener("click", () => {
      if (!playbackRunning) {
        playbackCursor = 0;
        startPlayback();
        return;
      }
      if (playbackPaused) {
        resumePlayback();
      } else {
        pausePlayback();
      }
    });

    stopEl.addEventListener("click", () => {
      stopPlayback("已停止");
    });

    restoreVoiceSettings();
    loadGroupNav();
    tagsButtonEl.classList.toggle("active", PAGE_MODE === "tags");
    if (PAGE_MODE === "home") {
      observer.observe(sentinel);
      loadNext();
    } else if (PAGE_MODE === "tags") {
      sentinel.style.display = "none";
      loadTagsPage();
    } else if (PAGE_MODE === "group") {
      sentinel.style.display = "none";
      loadGroupPage(CURRENT_GROUP);
    } else {
      sentinel.style.display = "none";
      loadTagPage(CURRENT_TAG);
    }
  </script>
</body>
</html>
